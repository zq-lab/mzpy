[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mzpy"
version = "0.3.3"
description = "A pandas-like toolkit for MS data handling"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8"
authors = [{ name = "zq-lab", email = "zhangq@nwsuaf.edu.cn" }]
dependencies = [
    "igraph==0.11.9",
    "numba==0.60.0",
    "numpy==2.0.2",
    "pandas==2.2.3",
    "plotnine==0.14.5",
    "pycairo==1.28.0",
    "rdkit==2024.9.1",
    "requests==2.32.3",
    "scikit-learn==1.6.0",
    "scipy==1.15.0",
    "seaborn==0.13.2",
    "tomli==2.0.1",
    "tqdm==4.67.1"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

# 如需包含包内数据文件
[tool.setuptools.package-data]
your_package = ["mass.csv"]