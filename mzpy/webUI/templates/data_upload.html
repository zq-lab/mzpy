{% extends "base.html" %}
{% block title %}Upload Data – mzpy{% endblock %}
{% block subtitle %}1. Data Upload{% endblock %}

{% block content %}
<div class="tile tile-parchment">
  <div class="container" style="max-width: 720px;">
    <h2>Upload MSDial Alignment</h2>
    <p style="color: var(--muted-ink-80);">Select the alignment file exported from MSDial. Supported formats: <code>.txt</code>, <code>.csv</code>, <code>.xlsx</code>.</p>

    <form method="post" enctype="multipart/form-data" style="margin-top: 32px;">
      <div class="form-group">
        <input type="file" name="alignment_file" accept=".txt,.csv,.xlsx" required>
      </div>
      <button type="submit" class="btn btn-primary">Upload & Parse</button>
    </form>
  </div>
</div>
{% endblock %}
